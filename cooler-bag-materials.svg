  <text x="925" y="258" fill="#172538" font-size="31" font-weight="700">Oxford Fabric</text>
  <text x="925" y="291" fill="#687587" font-size="21">牛津布</text>
  <text x="925" y="329" fill="#4d5a69" font-size="18">Abrasion-resistant · Tear-resistant</text>
