<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">MINLU three-layer outdoor cooler bag fabric construction</title>
<desc id="desc">Exploded three-layer fabric diagram showing Oxford fabric, pearl cotton cushioning, and reinforced mesh fabric, with English and Chinese labels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f9fb"/><stop offset="1" stop-color="#eef1f4"/></linearGradient>
  <linearGradient id="ox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#41464d"/><stop offset="1" stop-color="#171c23"/></linearGradient>
  <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dfe5"/></linearGradient>
  <linearGradient id="mesh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303740"/><stop offset="1" stop-color="#111820"/></linearGradient>
  <pattern id="weave" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 4H16 M0 12H16 M4 0V16 M12 0V16" stroke="#aab0b8" stroke-opacity=".18" stroke-width="2"/></pattern>
  <pattern id="foamdots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2" fill="#aeb8c2" opacity=".5"/><circle cx="15" cy="15" r="2" fill="#aeb8c2" opacity=".5"/></pattern>
  <pattern id="meshgrid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 0L18 18 M18 0L0 18" stroke="#aeb7c2" stroke-opacity=".22" stroke-width="1.5"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#182333" flood-opacity=".14"/></filter>
</defs>
<rect width="1440" height="760" rx="24" fill="url(#bg)"/>
<text x="82" y="88" fill="#172538" font-family="Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="2">THREE-LAYER FABRIC CONSTRUCTION</text>
<text x="84" y="126" fill="#687587" font-family="Arial, sans-serif" font-size="20">多层复合面料结构 · DURABILITY  /  CUSHIONING  /  PROTECTION</text>
